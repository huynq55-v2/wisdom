[package]
name = "wisdom"
version = "0.1.0"
edition = "2024"

[features]
train = []

[dependencies]
macroquad = "0.4.14"
crossbeam-channel = "0.5"
rand = "0.10"
rand_distr = "0.6"
walkdir = "2.5.0"
safetensors = "0.7"
serde_json = "1.0"
parking_lot = "0.12.5"
ort = { version = "2.0.0-rc.9", features = ["directml", "ndarray"] }
ndarray = "0.17"

[[bin]]
name = "gui"
path = "src/bin/gui.rs"

[[bin]]
name = "selfplay"
path = "src/bin/selfplay.rs"

[[bin]]
name = "build_dataset"
path = "src/bin/build_dataset.rs"

[[bin]]
name = "inspect"
path = "src/bin/inspect.rs"

[[bin]]
name = "convert_mpk"
path = "src/bin/convert_mpk.rs"

[[bin]]
name = "arena"
path = "src/bin/arena.rs"

[[bin]]
name = "train"
path = "src/bin/train.rs"
